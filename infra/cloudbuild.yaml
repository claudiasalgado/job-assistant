# Construye la imagen de un servicio (api o worker) en Cloud Build, en linux/amd64 (la
# arquitectura de Cloud Run), y la sube a Artifact Registry. Desde la raíz del repo:
#   gcloud builds submit . --config=infra/cloudbuild.yaml --substitutions=_SERVICE=worker ...

steps:
  # El mismo docker build que en local: Dockerfile en services/<servicio>, contexto en la raíz
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/${_SERVICE}/Dockerfile", "-t", "${_IMAGE}", "."]

# Las imágenes de esta lista se suben al registro al acabar todos los pasos
images: ["${_IMAGE}"]

substitutions:
  _SERVICE: api
  # Los scripts de infra/ usan latest; el CI pasa el hash del commit (decisión 025)
  _TAG: latest
  _IMAGE: europe-west4-docker.pkg.dev/${PROJECT_ID}/job-assistant/${_SERVICE}:${_TAG}

options:
  # Necesario para que _IMAGE pueda usar ${PROJECT_ID}, ${_SERVICE} y ${_TAG} dentro de su valor
  dynamicSubstitutions: true
  # Obligatorio si el build corre con una cuenta propia (ci-build): los logs van solo a
  # Cloud Logging, sin bucket de logs
  logging: CLOUD_LOGGING_ONLY
