<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Assistant</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --card: #fff; --border: #ddd; --accent: #2563eb; --warn: #b45309; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #999; --card: #1b1b1b; --border: #333; --accent: #60a5fa; --warn: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    textarea, select, button { font: inherit; color: inherit; }
    textarea { width: 100%; min-height: 280px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; resize: vertical; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    select { padding: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    button { padding: 8px 20px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: var(--muted); }
    #result { margin-top: 24px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    #result[hidden] { display: none; }
    #result h2 { font-size: 1.1rem; margin: 0 0 8px; }
    .warn { color: var(--warn); }
    a { color: var(--accent); }
    h2.section { font-size: 1.2rem; margin: 40px 0 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td.wrap { white-space: normal; min-width: 180px; }
    .score { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Job Assistant</h1>
    <form id="form">
      <label for="offer">Pega aquí la oferta</label>
      <textarea id="offer" required minlength="50" maxlength="20000"></textarea>
      <div class="row">
        <label for="language">Idioma del CV</label>
        <select id="language">
          <option value="">El de la oferta</option>
          <option value="es">Castellano</option>
          <option value="en">Inglés</option>
        </select>
        <button id="submit" type="submit">Generar CV</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <section id="result" hidden>
      <h2 id="title"></h2>
      <p id="meta"></p>
      <p id="match"></p>
      <ul id="warnings" class="warn"></ul>
      <a id="pdf" target="_blank">Abrir el CV en PDF</a>
    </section>

    <h2 class="section">Mis candidaturas</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Puesto</th><th>Encaje</th><th>Estado</th><th>CV</th></tr></thead>
        <tbody id="applications"></tbody>
      </table>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $("form").addEventListener("submit", async (event) => {
      // Sin esto el navegador recargaría la página al enviar el formulario
      event.preventDefault();
      $("submit").disabled = true;
      $("result").hidden = true;
      $("status").textContent = "Generando… (unos 20 segundos)";

      try {
        // Ruta relativa: misma URL que la página, así no hay CORS y viaja la cookie de IAP.
        // La api responde 202 al momento con un task; el trabajo lo hace el worker
        const task = await request("applications", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            offer_text: $("offer").value,
            language: $("language").value || null,
          }),
        });
        const done = await waitForTask(task.id);
        showResult(await request(`applications/${done.application_id}`));
        $("status").textContent = "";
        loadApplications();
      } catch (error) {
        $("status").textContent = `Error: ${error.message}`;
      } finally {
        $("submit").disabled = false;
      }
    });

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(formatError(data.detail));
      return data;
    }

    const STATE_LABELS = { queued: "En cola…", running: "Generando… (unos 20 segundos)" };

    // Polling: pregunta por el task cada 2 s hasta que acaba. failed es definitivo;
    // queued con error es un fallo que Pub/Sub va a reintentar, así que se sigue esperando
    async function waitForTask(taskId) {
      const deadline = Date.now() + 5 * 60 * 1000;
      while (Date.now() < deadline) {
        const task = await request(`tasks/${taskId}`);
        if (task.state === "done") return task;
        if (task.state === "failed") throw new Error(task.error);
        $("status").textContent = task.state === "queued" && task.error
          ? `Ha fallado el intento ${task.attempts} (${task.error}). Reintentando…`
          : STATE_LABELS[task.state];
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
      const task = await request(`tasks/${taskId}`);
      throw new Error(task.error ?? "el trabajo no ha terminado en 5 minutos");
    }

    function showResult(app) {
      const offer = app.extracted;
      // textContent y no innerHTML: el texto viene de Gemini y de la oferta, nunca se interpreta como HTML
      $("title").textContent = [offer.title, offer.company].filter(Boolean).join(" · ");
      $("meta").textContent = [offer.location, offer.modality, offer.seniority, `CV en ${app.language}`].filter(Boolean).join(" · ");
      $("warnings").replaceChildren(...app.warnings.map((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        return li;
      }));
      $("match").textContent = app.match
        ? `Encaje ${app.match.score}/100` + (app.match.gaps.length ? ` · Te falta: ${app.match.gaps.join(", ")}` : "")
        : "";
      $("pdf").href = app.cv_pdf_url.replace(/^\//, "");
      $("result").hidden = false;
    }

    const STATUSES = {
      cv_ready: "CV listo", applied: "Enviada", screening: "Primer filtro", interview: "Entrevistas",
      offer: "Oferta", rejected: "Descartada", ghosted: "Sin respuesta",
    };

    // Panel de seguimiento: cada cambio de estado va a la api, que lo publica para BigQuery
    async function loadApplications() {
      const apps = await request("applications");
      $("applications").replaceChildren(...apps.map((app) => {
        const row = document.createElement("tr");
        const cell = (text, className) => {
          const td = document.createElement("td");
          td.textContent = text;
          if (className) td.className = className;
          row.append(td);
          return td;
        };
        cell(new Date(app.created_at).toLocaleDateString());
        cell([app.extracted.title, app.extracted.company].filter(Boolean).join(" · "), "wrap");
        cell(app.match ? app.match.score : "–", "score");

        const select = document.createElement("select");
        for (const [value, label] of Object.entries(STATUSES)) select.add(new Option(label, value, false, value === app.status));
        select.addEventListener("change", async () => {
          select.disabled = true;
          try {
            await request(`applications/${app.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: select.value }),
            });
          } catch (error) {
            select.value = app.status;
            alert(`No se pudo cambiar el estado: ${error.message}`);
          } finally {
            select.disabled = false;
          }
          app.status = select.value;
        });
        cell("").append(select);

        const link = document.createElement("a");
        link.href = app.cv_pdf_url.replace(/^\//, "");
        link.target = "_blank";
        link.textContent = "PDF";
        cell("").append(link);
        return row;
      }));
    }

    loadApplications().catch((error) => { $("status").textContent = `Error: ${error.message}`; });

    // FastAPI devuelve un texto (errores propios) o una lista (validación de Pydantic)
    function formatError(detail) {
      if (Array.isArray(detail)) return detail.map((d) => d.msg).join("; ");
      return detail ?? "error desconocido";
    }
  </script>
</body>
</html>
