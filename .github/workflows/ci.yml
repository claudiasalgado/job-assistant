# Tests en cada push y en cada pull request. No tocan GCP ni Gemini (decisión 024).
# Si pasan y es un push a main, despliega api y worker sin claves JSON (decisión 025).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura del repo: el job de tests no necesita escribir nada
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Las mismas librerías de sistema que la imagen del worker: sin ellas, los
      # tests del PDF se saltarían en vez de ejecutarse
      - name: Instalar pango para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      # Misma versión de uv que en local y en los Dockerfiles; Python sale de .python-version
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          enable-cache: true

      # --frozen: si el uv.lock no está al día con los pyproject, falla en vez de corregirlo
      - name: Instalar dependencias
        run: uv sync --all-packages --frozen

      - name: Tests
        run: uv run --all-packages pytest -v

  deploy:
    # Solo si los tests pasan, y nunca desde un pull request: el proveedor de WIF
    # también rechaza cualquier token que no venga de refs/heads/main
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Un servicio por job, en paralelo; si falla uno, el otro se despliega igual
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    # Dos pushes seguidos no despliegan a la vez; el segundo espera al primero
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false
    # id-token: write deja al job pedir a GitHub el token OIDC firmado que GCP valida
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: job-assistant-clau
      REGION: europe-west4
    steps:
      - uses: actions/checkout@v7

      # Cambia el token de GitHub por credenciales de github-deployer que caducan en 1 h
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/333565578201/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@job-assistant-clau.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # La imagen se etiqueta con el hash del commit: cada revisión de Cloud Run
      # apunta a un código concreto y volver atrás es elegir una revisión anterior
      # --service-account: el build corre como ci-build y no como la cuenta de Compute con Editor
      # --suppress-logs: espera al build sin leer sus logs, que pedirían logging.viewer en todo el proyecto
      - name: Build en Cloud Build
        run: |
          gcloud builds submit . \
            --project="$PROJECT" \
            --region="$REGION" \
            --config=infra/cloudbuild.yaml \
            --substitutions="_SERVICE=${{ matrix.service }},_TAG=${GITHUB_SHA}" \
            --default-buckets-behavior=regional-user-owned-bucket \
            --service-account="projects/${PROJECT}/serviceAccounts/ci-build@${PROJECT}.iam.gserviceaccount.com" \
            --suppress-logs

      # update y no deploy: solo cambia la imagen. La configuración (memoria, IAP,
      # variables) sigue viniendo de infra/deploy-*.sh
      - name: Nueva revisión en Cloud Run
        run: |
          gcloud run services update "${{ matrix.service }}" \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT}/job-assistant/${{ matrix.service }}:${GITHUB_SHA}" \
            --quiet
