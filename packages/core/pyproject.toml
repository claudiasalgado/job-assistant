[project]
name = "core"
version = "0.1.0"
description = "Modelos Pydantic compartidos: oferta, perfil y CV adaptado"
readme = "README.md"
authors = [
    { name = "Clàudia Salgado", email = "235334667+claudiasalgado@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
